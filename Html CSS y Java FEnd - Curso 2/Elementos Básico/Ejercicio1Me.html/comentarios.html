<!DOCTYPE html>
<html lang="es-mx, en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comentary</title>
</head>
<body>
    <h1>Comentarios</h1>
    <p>Deja tu comentario aquí:</p>
    <form action="submit_comment.html" method="post">
        <label for="name">Nombre:</label><br>
        <input type="text" id="name" name="name" placeholder="Tu nombre" required>
        <label for="lastname"></label>
        <input type="text" id="lastname" name="lastname" placeholder="Tu apellido" required><br><br>
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" placeholder="Tu correo @"><br><br>
        <label for="comment">Comentario:</label><br>
        <textarea id="comment" name="comment" placeholder="Tu comentario"></textarea><br><br>
        <input type="submit" value="Enviar">
    </form>
    <br>
    <p>Regresar al menu principal <a href="index.html">INICIO</a>.</p>
</body>
</html>
